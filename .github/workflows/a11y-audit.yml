name: Accessibility CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.kt'
    with:
      use_compact_skill: false

jobs:
  run-audit:
    uses: cesar-montesdeoca-wizeline/mobile-a11y-guardian/.github/workflows/reusable_audit.yml@main
    secrets: inherit